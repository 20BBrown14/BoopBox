# BoopBox bundled Mosquitto broker config (Option A: authenticated).
#
# Local/plain MVP default: one plaintext listener on 1883. TLS on 8883 is
# DEFERRED (not configured here); the app already supports BOOPBOX_MQTT_TLS +
# CA for when an admin fronts TLS. See the README deployment section.
#
# allow_anonymous is false so every connection carries a username, which the
# ACL file keys on via %u. Without authenticated usernames the per-device ACL
# pattern is inert.

listener 1883

allow_anonymous false

password_file /mosquitto/config/password_file
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/
