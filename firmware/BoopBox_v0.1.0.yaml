# BoopBox v0.1.0 — WiFi onboarding + NFC read/write + audio bring-up.
# Hardware: Adafruit Feather ESP32-S3 (4MB/2MB), PN532 in I2C mode,
# MAX98357A I2S amp. Wiring: hardware/boopbox-proto (KiCad).

substitutions:
  name: boopbox
  friendly_name: BoopBox
  i2c_sda_pin: GPIO3
  i2c_scl_pin: GPIO4
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO10
  i2s_dout_pin: GPIO11
  # Server control plane. device_id is the box's MQTT identity and must match a
  # device the server knows (the server's seed device defaults to boop-test).
  device_id: boop-test
  mqtt_broker: 192.168.68.64

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # GPIO7 powers the Feather's STEMMA QT / I2C port; must be high before the
    # bus scan or the PN532 is unpowered.
    - priority: 800
      then:
        - output.turn_on: i2c_power
    # Apply the restored Balance slider once everything is set up.
    - priority: -100
      then:
        - lambda: 'id(balance_spk).set_balance(id(balance_number).state / 100.0f);'

external_components:
  - source:
      type: local
      path: components
    components: [balance]

esp32:
  board: adafruit_feather_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 4MB

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: gpio
    id: i2c_power
    pin: GPIO7

logger:
  level: DEBUG

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_nfc
      name: "NFC"
      sorting_weight: 10
    - id: grp_boop
      name: "Boop"
      sorting_weight: 15
    - id: grp_audio_test
      name: "Audio Test"
      sorting_weight: 20
    - id: grp_device
      name: "Device"
      sorting_weight: 90

# No credentials baked in: provisioned via Improv (serial) or the captive-portal AP.
wifi:
  ap:
    ssid: BoopBox Setup
    password: SnoopBox
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
      dns1: 192.168.4.1
captive_portal:
improv_serial:

time:
  - platform: sntp
    id: sntp_time

api:
ota:
  - platform: esphome

# Boop flow: a tag read (or Simulate Tag Read) publishes a boop; the server
# answers on play (stream URL) or error. No broker auth yet.
mqtt:
  broker: ${mqtt_broker}
  port: 1883
  client_id: ${device_id}
  discovery: false
  # Keep ESPHome's own state/log topics out of the boopbox/ tree.
  topic_prefix: esphome/${device_id}
  log_topic: null
  on_json_message:
    - topic: boopbox/${device_id}/play
      then:
        - lambda: |-
            std::string slug = x["boop"]["slug"] | "";
            ESP_LOGI("boopbox", "play for '%s'", slug.c_str());
            id(boop_status).publish_state("playing " + slug);
        - media_player.play_media:
            id: boop_player
            media_url: !lambda 'return std::string(x["url"] | "");'
    - topic: boopbox/${device_id}/error
      then:
        - lambda: |-
            std::string code = x["code"] | "unknown";
            std::string slug = x["boop"]["slug"] | "";
            ESP_LOGW("boopbox", "boop error for '%s': %s", slug.c_str(), code.c_str());
            id(boop_status).publish_state("error: " + code + " (" + slug + ")");

script:
  - id: send_boop
    mode: parallel
    parameters:
      slug: string
      uid: string
    then:
      - mqtt.publish_json:
          topic: boopbox/${device_id}/boop
          payload: |-
            char boop_id[9];
            snprintf(boop_id, sizeof(boop_id), "%08x", (unsigned) random_uint32());
            auto now = id(sntp_time).now();
            root["v"] = 1;
            root["id"] = std::string(boop_id);
            root["slug"] = slug;
            root["uid"] = uid;
            root["ts"] = now.is_valid() ? (int64_t) now.timestamp : (int64_t) 0;
      - lambda: |-
          ESP_LOGI("boopbox", "boop sent: slug='%s' uid='%s'", slug.c_str(), uid.c_str());
          id(boop_status).publish_state("sent " + slug);

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz
  id: bus_a

text_sensor:
  - platform: template
    name: "Last NFC UID"
    id: last_nfc_uid
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 20
    icon: mdi:nfc-variant
  - platform: template
    name: "Last NFC Payload"
    id: last_nfc_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 30
    icon: mdi:card-text-outline
  - platform: template
    name: "Last Boop Result"
    id: boop_status
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 30
    icon: mdi:message-reply-text-outline

binary_sensor:
  - platform: template
    name: "NFC Tag Present"
    id: nfc_tag_present
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 10
    icon: mdi:nfc-tap

# Write staged payload to the next NDEF-capable tag tapped (NTAG21x/Ultralight).
text:
  - platform: template
    name: "Tag Write Payload"
    id: tag_write_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 40
    optimistic: true
    mode: text
    initial_value: "boop/zelda"

  # Slug sent by Simulate Tag Read, exactly as if a tag carrying it were tapped.
  - platform: template
    name: "Simulate Slug"
    id: simulate_slug
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "boop/innuendo"

  # Audio bring-up: any MP3/FLAC/WAV URL reachable from the box, e.g. a file
  # served with `python -m http.server` on your machine.
  - platform: template
    name: "Test Audio URL"
    id: test_audio_url
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "http://192.168.1.100:8000/test.mp3"

# 0-100 maps onto the media player's volume_min..volume_max, so 100 is the cap.
number:
  - platform: template
    name: "Volume"
    id: volume_number
    icon: mdi:volume-high
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 15
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: 'return id(boop_player).volume * 100.0f;'
    set_action:
      - media_player.volume_set:
          id: boop_player
          volume: !lambda 'return x / 100.0f;'

  # -100 = left only, 0 = centre, +100 = right only. Near side stays at full level.
  - platform: template
    name: "Balance"
    id: balance_number
    icon: mdi:pan-horizontal
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 16
    mode: slider
    min_value: -100
    max_value: 100
    step: 5
    initial_value: 0
    optimistic: true
    restore_value: true
    on_value:
      - lambda: 'id(balance_spk).set_balance(x / 100.0f);'

# Shows the player's real mute state. The mute is saved across reboots and isn't
# otherwise visible on this page.
switch:
  - platform: template
    name: "Mute"
    id: mute_switch
    icon: mdi:volume-off
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 17
    lambda: 'return id(boop_player).is_muted();'
    turn_on_action:
      - media_player.mute: boop_player
    turn_off_action:
      - media_player.unmute: boop_player

button:
  - platform: template
    name: "Write Tag"
    id: write_tag_button
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 50
    icon: mdi:nfc-tap
    on_press:
      then:
        - lambda: |-
            auto message = new nfc::NdefMessage();
            message->add_text_record(id(tag_write_payload).state);
            ESP_LOGI("boopbox", "Staging write, tap a tag now: %s",
                     id(tag_write_payload).state.c_str());
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - logger.log: "Finished writing tag"

  - platform: template
    name: "Simulate Tag Read"
    id: simulate_tag_read_button
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 20
    icon: mdi:nfc-search-variant
    on_press:
      - script.execute:
          id: send_boop
          slug: !lambda 'return id(simulate_slug).state;'
          uid: "simulated"

  - platform: template
    name: "Play Test Audio"
    id: play_test_audio_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 20
    icon: mdi:play
    on_press:
      - media_player.play_media:
          id: boop_player
          media_url: !lambda 'return id(test_audio_url).state;'

  - platform: restart
    name: "Restart"
    id: restart_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 10

  # ESPHome has no WiFi-only clear; factory_reset wipes all prefs (which here is
  # effectively just the WiFi creds) and reboots into onboarding.
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 20

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrclk_pin}

# MAX98357A: GAIN to GND (12 dB), SD floating (L+R mix). Mono puts the same
# sample in both I2S slots, so the amp's L+R mix plays it at full level.
speaker:
  - platform: i2s_audio
    id: boop_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono
  # Left/right balance in front of the I2S speaker; the media player plays into this.
  - platform: balance
    id: balance_spk
    output_speaker: boop_speaker

media_player:
  - platform: speaker
    name: "BoopBox Player"
    id: boop_player
    # NONE builds every decoder (MP3/FLAC/WAV/Opus) so arbitrary stream URLs
    # play, not just what Home Assistant would transcode to.
    announcement_pipeline:
      speaker: balance_spk
      format: NONE
    # Full scale for now; 5V supply limits output to ~3 W. Lower to cap for small ears.
    volume_max: 1.0
    volume_initial: 0.4

pn532_i2c:
  id: pn532_board
  i2c_id: bus_a
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          id(last_nfc_uid).publish_state(x);
          id(nfc_tag_present).publish_state(true);

          ESP_LOGI("boopbox", "=== NFC TAG READ ===");
          ESP_LOGI("boopbox", "UID: %s", x.c_str());

          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            const auto &records = message->get_records();
            ESP_LOGI("boopbox", "NDEF records: %d", (int) records.size());

            std::string combined;
            std::string slug;
            int i = 0;
            for (auto &record : records) {
              std::string type = record->get_type();
              std::string payload = record->get_payload();
              ESP_LOGI("boopbox", "  [%d] type='%s' payload='%s'",
                       i, type.c_str(), payload.c_str());
              if (!combined.empty()) combined += " | ";
              combined += payload;
              // The slug is the first NDEF text record.
              if (slug.empty() && type == "T") slug = payload;
              i++;
            }
            id(last_nfc_payload).publish_state(combined);
            if (!slug.empty()) {
              id(send_boop).execute(slug, x);
            } else {
              ESP_LOGI("boopbox", "No text record; not booping.");
            }
          } else {
            ESP_LOGI("boopbox", "No NDEF message on this tag (UID-only read).");
            id(last_nfc_payload).publish_state("<no NDEF — UID only>");
          }
          ESP_LOGI("boopbox", "====================");
  on_tag_removed:
    then:
      - lambda: |-
          id(nfc_tag_present).publish_state(false);
          ESP_LOGD("boopbox", "Tag removed: %s", x.c_str());
