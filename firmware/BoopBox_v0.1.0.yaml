# BoopBox v0.1.0
# Hardware: Adafruit Feather ESP32-S3 (4MB/2MB), PN532 in I2C mode,
# MAX98357A I2S amp. Wiring: hardware/boopbox-proto (KiCad).

substitutions:
  name: boopbox
  friendly_name: BoopBox
  # device_id is the box's stable identity: its MQTT username (broker ACLs key
  # on it) and the <id> in every boopbox/<id>/... topic. Must match a broker
  # account. Override per box at flash/compile time.
  device_id: boop-test
  mqtt_broker: 192.168.86.76
  mqtt_port: "1884"
  mqtt_username: boop-test
  mqtt_password: booptestpassword
  # Override at build time with `-s firmware_version X.Y.Z` to produce an OTA target.
  firmware_version: 0.1.0
  chip_family: esp32s3
  # Where the server's /firmware host is reachable from the box. The flash cmd
  # carries only a path.
  server_base_url: http://192.168.86.76:9685
  i2c_sda_pin: GPIO3
  i2c_scl_pin: GPIO4
  i2s_bclk_pin: GPIO38        # Feather RX (moved off D9: I2S clocks shifted D5/D6 touch)
  i2s_lrclk_pin: GPIO39       # Feather TX
  i2s_dout_pin: GPIO37        # Feather MI
  # Capacitive touch pads (ESP32-S3 native touch; GPIO1-14 are touch-capable).
  touch_vol_up_pin: GPIO5      # Feather D5
  touch_vol_down_pin: GPIO6    # Feather D6
  touch_play_pin: GPIO14       # Feather A4
  # A0 on the Feather ESP32-S3 = GPIO18. NeoPixel ring data line.
  led_ring_pin: GPIO18

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # GPIO7 powers the Feather's STEMMA QT / I2C port; must be high before the
    # bus scan or the PN532 is unpowered.
    priority: 800
    then:
      - output.turn_on: i2c_power

esp32:
  board: adafruit_feather_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 4MB

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: gpio
    id: i2c_power
    pin: GPIO7

logger:
  level: DEBUG

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_nfc
      name: "NFC"
      sorting_weight: 10
    - id: grp_boop
      name: "Boop"
      sorting_weight: 15
    - id: grp_audio_test
      name: "Audio Test"
      sorting_weight: 20
    - id: grp_controls
      name: "Controls"
      sorting_weight: 25
    - id: grp_led
      name: "LED Color"
      sorting_weight: 30
    - id: grp_device
      name: "Device"
      sorting_weight: 90

# No credentials baked in: provisioned via Improv (serial) or the captive-portal AP.
wifi:
  ap:
    ssid: BoopBox Setup
    password: SnoopBox
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
      dns1: 192.168.4.1
captive_portal:
improv_serial:

time:
  - platform: sntp
    id: sntp_time

# The box ↔ server contract runs over MQTT (server/docs/mqtt.md). discovery is
# off and topic_prefix null because the server owns the boopbox/<id>/... topic
# namespace rather than ESPHome's default device topics. idf_send_async keeps
# publishes off the main loop on the esp-idf framework.
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  client_id: ${device_id}
  discovery: false
  topic_prefix: null
  idf_send_async: true
  on_connect:
    # Report firmware/chip on every (re)connect: the server's OTA policy keys
    # off this unsolicited version report and the reply to get_version.
    # on_connect fires before the client counts as connected, so an immediate
    # publish is silently dropped. The delay lets the cmd subscription land
    # before the server's flash reply.
    then:
      - wait_until:
          condition:
            mqtt.connected:
          timeout: 10s
      - delay: 1s
      - script.execute: publish_version
  on_json_message:
    # play — server → boopbox/<id>/play. The answer to a boop: stream `url`
    # through the media pipeline so the transport buttons can pause/resume it.
    # title/album/artist/duration are optional metadata the box may ignore.
    - topic: boopbox/${device_id}/play
      then:
        - lambda: |-
            if (!x.containsKey("url")) {
              ESP_LOGW("boopbox", "play without url; ignoring");
              return;
            }
            std::string url = x["url"].as<std::string>();
            const char *slug = x.containsKey("boop") && x["boop"].containsKey("slug")
                                 ? x["boop"]["slug"].as<const char *>() : "?";
            ESP_LOGI("boopbox", "play slug='%s' url=%s", slug, url.c_str());
            id(boop_status).publish_state(std::string("playing ") + slug);
            id(boop_player)
                ->make_call()
                .set_media_url(url)
                .perform();
    # error — server → boopbox/<id>/error. A boop could not be answered. Branch
    # on `code`; `message` is generic display text. `boop` may be null for
    # unsupported_version.
    - topic: boopbox/${device_id}/error
      then:
        - lambda: |-
            std::string code = x.containsKey("code")
                                 ? x["code"].as<std::string>() : "unknown";
            const char *slug = x.containsKey("boop") && x["boop"].containsKey("slug")
                                 ? x["boop"]["slug"].as<const char *>() : "?";
            ESP_LOGW("boopbox", "boop error slug='%s' code=%s", slug, code.c_str());
            id(boop_status).publish_state("error: " + code + " (" + slug + ")");

    # error — server → boopbox/<id>/error. A boop could not be answered. Branch
    # on `code`, not `message` (per the contract).
    - topic: boopbox/${device_id}/error
      then:
        - lambda: |-
            const char *code = x.containsKey("code")
                                 ? x["code"].as<const char *>() : "?";
            ESP_LOGW("boopbox", "boop error code=%s", code);

    # cmd — server → boopbox/<id>/cmd. get_version re-reports; flash pulls the
    # bin over authenticated HTTP. The device-id topic is the only one that may
    # flash.
    - topic: boopbox/${device_id}/cmd
      then:
        - lambda: |-
            if (!x.containsKey("cmd")) return;
            std::string cmd = x["cmd"].as<std::string>();
            ESP_LOGI("boopbox", "cmd=%s", cmd.c_str());
            if (cmd == "get_version") {
              id(publish_version)->execute();
            } else if (cmd == "flash") {
              std::string url = x["url"] | "";
              std::string md5 = x["md5"] | "";
              // Reject anything but a served firmware path and a 32-char md5.
              if (url.rfind("/firmware/", 0) != 0 || md5.size() != 32) {
                ESP_LOGW("boopbox", "flash cmd malformed; ignoring");
                return;
              }
              id(ota_flash_url) = "${server_base_url}" + url;
              id(ota_flash_md5) = md5;
              id(run_ota_flash)->execute();
            }

    # Broadcast cmd: version query only, never a flash.
    - topic: boopbox/all/cmd
      then:
        - lambda: |-
            if (x.containsKey("cmd") && x["cmd"] == "get_version") {
              id(publish_version)->execute();
            }

api:
http_request:
ota:
  - platform: esphome
  - platform: http_request
    id: ota_http
    # OTA blocks the main loop, so light actions never render mid-update. The
    # ring is lit on begin (sets brightness correction) and progress is written
    # straight to the strip.
    on_begin:
      - light.turn_on:
          id: led_ring
          red: 0%
          green: 0%
          blue: 0%
          brightness: 60%
          transition_length: 0s
    on_progress:
      - lambda: |-
          auto *ring = static_cast<light::AddressableLight *>(id(led_ring)->get_output());
          int lit = (int) (x * ring->size() / 100.0f + 0.5f);
          for (int i = 0; i < ring->size(); i++) {
            (*ring)[i] = i < lit ? Color(255, 140, 0) : Color(0, 0, 0);
          }
          ring->schedule_show();
          ring->write_state(id(led_ring));
    on_end:
      - lambda: |-
          auto *ring = static_cast<light::AddressableLight *>(id(led_ring)->get_output());
          ring->all() = Color(0, 255, 0);
          ring->schedule_show();
          ring->write_state(id(led_ring));
    on_error:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 0%
                blue: 0%
                brightness: 60%
                transition_length: 0s
            - delay: 300ms
            - light.turn_off:
                id: led_ring
                transition_length: 0s
            - delay: 300ms

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz
  id: bus_a

# Native touch hub. On S2/S3 the hardware tracks each pad's untouched baseline
# ("benchmark") itself; a pad reads touched when smooth - benchmark > threshold,
# so each sensor's threshold is a delta, not an absolute reading. setup_mode
# logs value/benchmark/difference ~1/s for calibration: set each threshold to
# ~50-70% of the touched difference, then turn setup_mode off (it costs CPU).
# Default 8ms measurement is too long for the S3.
esp32_touch:
  setup_mode: false
  measurement_duration: 0.25ms
  sleep_duration: 0.5ms

# Battery fuel gauge: the Feather ESP32-S3 has a MAX17048 at I2C 0x36 on the
# STEMMA QT bus (GPIO7-powered). ESPHome's max17043 driver covers the MAX17048.
sensor:
  - platform: max17043
    i2c_id: bus_a
    update_interval: 60s
    battery_level:
      name: "Battery"
      id: battery_level
      accuracy_decimals: 0
      web_server:
        sorting_group_id: grp_device
        sorting_weight: 1
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      accuracy_decimals: 2
      web_server:
        sorting_group_id: grp_device
        sorting_weight: 2

text_sensor:
  - platform: template
    name: "Last NFC UID"
    id: last_nfc_uid
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 20
    icon: mdi:nfc-variant
  - platform: template
    name: "Last NFC Payload"
    id: last_nfc_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 30
    icon: mdi:card-text-outline
  # Outcome of the latest boop as the box saw it: sent, playing, error, or not sent.
  - platform: template
    name: "Last Boop Result"
    id: boop_status
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 30
    icon: mdi:message-reply-text-outline

binary_sensor:
  - platform: template
    name: "NFC Tag Present"
    id: nfc_tag_present
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 10
    icon: mdi:nfc-tap

  # Capacitive transport controls. Thresholds are BREADBOARD values (bare
  # metal lead tips, 2026-11-07): idle |diff| < ~200, hand hovering near a lead
  # ~800-1900, direct touch 150k-420k. Recalibrate behind the real panel; a
  # touch through plastic will be far smaller. The delayed_on/off filters debounce
  # brief noise spikes. They act on boop_player like the web UI buttons do.
  - platform: esp32_touch
    name: "Touch Vol Up"
    id: touch_vol_up
    pin: ${touch_vol_up_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 10
    icon: mdi:volume-plus
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: vol up"
      - media_player.volume_up: boop_player

  - platform: esp32_touch
    name: "Touch Vol Down"
    id: touch_vol_down
    pin: ${touch_vol_down_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 20
    icon: mdi:volume-minus
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: vol down"
      - media_player.volume_down: boop_player

  - platform: esp32_touch
    name: "Touch Play Pause"
    id: touch_play
    pin: ${touch_play_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 30
    icon: mdi:play-pause
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: play/pause"
      # Toggle play<->pause; ignored when nothing is playing or paused
      # (idle/announcing), so a stray touch can't start playback from idle.
      - if:
          condition:
            media_player.is_playing:
          then:
            - media_player.pause:
                id: boop_player
          else:
            - if:
                condition:
                  media_player.is_paused:
                then:
                  - media_player.play:
                      id: boop_player

# Write staged payload to the next NDEF-capable tag tapped (NTAG21x/Ultralight).
text:
  - platform: template
    name: "Tag Write Payload"
    id: tag_write_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 40
    optimistic: true
    mode: text
    initial_value: "boop/zelda"

  # Slug sent by Simulate Tag Read, exactly as if a tag carrying it were tapped.
  - platform: template
    name: "Simulate Slug"
    id: simulate_slug
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "boop/example"

  # Audio bring-up: any MP3/FLAC/WAV URL reachable from the box, e.g. a file
  # served with `python -m http.server` on your machine.
  - platform: template
    name: "Test Audio URL"
    id: test_audio_url
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "http://192.168.1.100:8000/test.mp3"

# 0-100 maps onto the media player's volume_min..volume_max, so 100 is the cap.
number:
  - platform: template
    name: "Volume"
    id: volume_number
    icon: mdi:volume-high
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 15
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: 'return id(boop_player).volume * 100.0f;'
    set_action:
      - media_player.volume_set:
          id: boop_player
          volume: !lambda 'return x / 100.0f;'

  # Standalone color tuner (0-255 per channel), independent of the boop flash.
  # Drives only the Preview Color button. restore_value keeps a tuned color
  # across reboots.
  - platform: template
    name: "Tune Color R"
    id: tune_color_r
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 10
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 128

  - platform: template
    name: "Tune Color G"
    id: tune_color_g
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 11
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 204

  - platform: template
    name: "Tune Color B"
    id: tune_color_b
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 12
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 255

  # Master brightness for the preview, separate from the R/G/B mix so you can
  # dim a hue without rescaling all three channels.
  - platform: template
    name: "Tune Brightness"
    id: tune_brightness
    icon: mdi:brightness-6
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 13
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 255

# Shows the player's real mute state. The mute is saved across reboots and isn't
# otherwise visible on this page.
switch:
  - platform: template
    name: "Mute"
    id: mute_switch
    icon: mdi:volume-off
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 17
    lambda: 'return id(boop_player).is_muted();'
    turn_on_action:
      - media_player.mute: boop_player
    turn_off_action:
      - media_player.unmute: boop_player

button:
  - platform: template
    name: "Write Tag"
    id: write_tag_button
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 50
    icon: mdi:nfc-tap
    on_press:
      then:
        - lambda: |-
            auto message = new nfc::NdefMessage();
            message->add_text_record(id(tag_write_payload).state);
            ESP_LOGI("boopbox", "Staging write, tap a tag now: %s",
                     id(tag_write_payload).state.c_str());
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - logger.log: "Finished writing tag"

  # Boop without a physical tag: goes through the same publish path as a tap.
  - platform: template
    name: "Simulate Tag Read"
    id: simulate_tag_read_button
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 20
    icon: mdi:nfc-search-variant
    on_press:
      - lambda: 'id(publish_boop)->execute(id(simulate_slug).state, "simulated");'

  - platform: template
    name: "Play Test Audio"
    id: play_test_audio_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 20
    icon: mdi:play
    on_press:
      - media_player.play_media:
          id: boop_player
          # Media pipeline so the Play/Pause/Stop buttons act on it.
          media_url: !lambda 'return id(test_audio_url).state;'

  # Software transport controls (no physical buttons yet). These act on whatever
  # the player is doing — a server play or the test-audio button.
  - platform: template
    name: "Play"
    id: play_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 30
    icon: mdi:play
    on_press:
      - media_player.play:
          id: boop_player

  - platform: template
    name: "Pause"
    id: pause_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 31
    icon: mdi:pause
    on_press:
      - media_player.pause:
          id: boop_player

  - platform: template
    name: "Stop"
    id: stop_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 32
    icon: mdi:stop
    on_press:
      - media_player.stop:
          id: boop_player

  # Hold the tuned color on the ring (steady, no fade) so you can eyeball it.
  - platform: template
    name: "Preview Color"
    id: preview_color_button
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 20
    icon: mdi:eyedropper
    on_press:
      - light.turn_on:
          id: led_ring
          red: !lambda 'return id(tune_color_r).state / 255.0f;'
          green: !lambda 'return id(tune_color_g).state / 255.0f;'
          blue: !lambda 'return id(tune_color_b).state / 255.0f;'
          brightness: !lambda 'return id(tune_brightness).state / 255.0f;'
          transition_length: 0s

  # Turn the ring off (clears a held preview).
  - platform: template
    name: "LED Off"
    id: led_off_button
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 22
    icon: mdi:lightbulb-off
    on_press:
      - light.turn_off:
          id: led_ring
          transition_length: 0s

  - platform: restart
    name: "Restart"
    id: restart_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 10

  # ESPHome has no WiFi-only clear; factory_reset wipes all prefs (which here is
  # effectively just the WiFi creds) and reboots into onboarding.
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 20

# Hand-off from the cmd lambda to the flash script: the action's templatable
# fields can't take the trigger's `x` from a separate script.
globals:
  - id: ota_flash_url
    type: std::string
  - id: ota_flash_md5
    type: std::string

script:
  # run_ota_flash — HTTP Basic: username = device id, password = OTA secret.
  - id: run_ota_flash
    mode: single
    then:
      - ota.http_request.flash:
          url: !lambda 'return id(ota_flash_url);'
          md5: !lambda 'return id(ota_flash_md5);'
          username: ${device_id}
          password: !secret boopbox_ota_secret

  # flash_boop — one light-blue flash on the ring to acknowledge a tap: snap on
  - id: flash_boop
    mode: restart
    then:
      - light.turn_on:
          id: led_ring
          # RGB 0,170,228 scaled to 0-1.
          red: 0%
          green: 66.7%
          blue: 89.4%
          brightness: 66%
          transition_length: 150ms
      - delay: 250ms
      - light.turn_off:
          id: led_ring
          transition_length: 400ms

  # version — box → boopbox/<id>/version. Firmware/chip telemetry the server's
  # OTA policy consumes; produces no reply.
  - id: publish_version
    then:
      - lambda: |-
          bool ok = id(mqtt_client).publish_json(
            "boopbox/${device_id}/version",
            [=](JsonObject root) {
              root["v"] = 1;
              root["firmware"] = "${firmware_version}";
              root["chip"] = "${chip_family}";
            });
          if (ok) {
            ESP_LOGI("boopbox", "version reported: ${firmware_version}");
          } else {
            ESP_LOGW("boopbox", "version publish failed");
          }

  # boop — box → boopbox/<id>/boop. One per tap; the server answers with a
  # single play or error. `slug` is the tag's NDEF payload; `uid` and `ts` are
  # informational.
  - id: publish_boop
    parameters:
      slug: string
      uid: string
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) {
            ESP_LOGW("boopbox", "MQTT not connected; dropping boop for '%s'",
                     slug.c_str());
            id(boop_status).publish_state("not sent (MQTT offline): " + slug);
            return;
          }
          // Short random correlation id, echoed back in the play/error reply.
          char boop_id[9];
          snprintf(boop_id, sizeof(boop_id), "%08x", (unsigned) random_uint32());
          std::string id_str(boop_id);
          uint32_t ts = id(sntp_time).now().is_valid()
                          ? (uint32_t) id(sntp_time).now().timestamp : 0;
          id(mqtt_client).publish_json(
            "boopbox/${device_id}/boop",
            [=](JsonObject root) {
              root["v"] = 1;
              root["id"] = id_str;
              root["slug"] = slug;
              root["uid"] = uid;
              root["ts"] = ts;
            });
          ESP_LOGI("boopbox", "Published boop id=%s slug='%s'",
                   id_str.c_str(), slug.c_str());
          id(boop_status).publish_state("sent " + slug);

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrclk_pin}

# MAX98357A: GAIN to GND (12 dB), SD floating = (L+R)/2 mix. One physical
# driver, so mono: the same samples go to both I2S slots, and the amp's L+R mix
# plays them at full level. Wiring: notes/breadboard-mono-connections.md.
speaker:
  - platform: i2s_audio
    id: boop_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono

  # Two pipelines (media + announcement) must each output to a unique speaker,
  # so a mixer fans them into the single physical driver. Media carries booped
  # tracks (pausable transport); announcements are fire-and-forget overlays.
  - platform: mixer
    id: boop_mixer
    output_speaker: boop_speaker
    source_speakers:
      - id: media_spk_in
      - id: announcement_spk_in

media_player:
  - platform: speaker
    name: "BoopBox Player"
    id: boop_player
    # NONE builds every decoder (MP3/FLAC/WAV/Opus) so arbitrary stream URLs
    # play, not just what Home Assistant would transcode to.
    media_pipeline:
      speaker: media_spk_in
      format: NONE
    announcement_pipeline:
      speaker: announcement_spk_in
      format: NONE
    # Ceiling protects the 3 W speaker and small ears; tune by ear.
    volume_max: 1.0
    volume_initial: 0.4

# NeoPixel ring (12x WS2812/NeoPixel) on A0 (GPIO18). esp32_rmt_led_strip drives
# it off the RMT peripheral, which is the reliable path on the esp-idf framework.
light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: ${led_ring_pin}
    num_leds: 12
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 30

pn532_i2c:
  id: pn532_board
  i2c_id: bus_a
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          id(last_nfc_uid).publish_state(x);
          id(nfc_tag_present).publish_state(true);

          ESP_LOGI("boopbox", "=== NFC TAG READ ===");
          ESP_LOGI("boopbox", "UID: %s", x.c_str());

          // slug is the first NDEF text record's payload, which is what Write
          // Tag stages (e.g. "boop/zelda"). A UID-only tag has no slug and so
          // cannot be resolved server-side; log and skip the boop.
          std::string slug;
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            // ESPHome 2026.10: get_records() returns a const StaticVector of
            // unique_ptr; bind by const ref and iterate by const ref.
            const auto &records = message->get_records();
            ESP_LOGI("boopbox", "NDEF records: %d", (int) records.size());

            std::string combined;
            int i = 0;
            for (const auto &record : records) {
              std::string type = record->get_type();
              std::string payload = record->get_payload();
              ESP_LOGI("boopbox", "  [%d] type='%s' payload='%s'",
                       i, type.c_str(), payload.c_str());
              if (slug.empty()) slug = payload;
              if (!combined.empty()) combined += " | ";
              combined += payload;
              i++;
            }
            id(last_nfc_payload).publish_state(combined);
          } else {
            ESP_LOGI("boopbox", "No NDEF message on this tag (UID-only read).");
            id(last_nfc_payload).publish_state("<no NDEF — UID only>");
          }

          if (!slug.empty()) {
            id(flash_boop)->execute();
            id(publish_boop)->execute(slug, x);
          } else {
            ESP_LOGW("boopbox", "No slug on tag; not booping.");
          }
          ESP_LOGI("boopbox", "====================");
  on_tag_removed:
    then:
      - lambda: |-
          id(nfc_tag_present).publish_state(false);
          ESP_LOGD("boopbox", "Tag removed: %s", x.c_str());