# BoopBox v0.1.0 — WiFi onboarding + NFC read/write + audio bring-up + MQTT.
# Hardware: Adafruit Feather ESP32-S3 (4MB/2MB), PN532 in I2C mode,
# MAX98357A I2S amp. Wiring: hardware/boopbox-proto (KiCad).

substitutions:
  name: boopbox
  friendly_name: BoopBox
  # device_id is the box's stable identity: its MQTT username (broker ACLs key
  # on it) and the <id> in every boopbox/<id>/... topic. Must match a broker
  # account. Override per box at flash/compile time.
  device_id: boop-test
  mqtt_broker: 192.168.86.76
  mqtt_port: "1884"
  mqtt_username: boop-test
  mqtt_password: booptestpassword
  firmware_version: 0.1.0
  chip_family: esp32s3
  i2c_sda_pin: GPIO3
  i2c_scl_pin: GPIO4
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO10
  i2s_dout_pin: GPIO11

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # GPIO7 powers the Feather's STEMMA QT / I2C port; must be high before the
    # bus scan or the PN532 is unpowered.
    priority: 800
    then:
      - output.turn_on: i2c_power

esp32:
  board: adafruit_feather_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 4MB

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: gpio
    id: i2c_power
    pin: GPIO7

logger:
  level: DEBUG

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_nfc
      name: "NFC"
      sorting_weight: 10
    - id: grp_audio_test
      name: "Audio Test"
      sorting_weight: 20
    - id: grp_device
      name: "Device"
      sorting_weight: 90

# No credentials baked in: provisioned via Improv (serial) or the captive-portal AP.
wifi:
  ap:
    ssid: BoopBox Setup
    password: SnoopBox
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
      dns1: 192.168.4.1
captive_portal:
improv_serial:

time:
  - platform: sntp
    id: sntp_time

# The box ↔ server contract runs over MQTT (server/docs/mqtt.md). discovery is
# off and topic_prefix null because the server owns the boopbox/<id>/... topic
# namespace rather than ESPHome's default device topics. idf_send_async keeps
# publishes off the main loop on the esp-idf framework.
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  client_id: ${device_id}
  discovery: false
  topic_prefix: null
  idf_send_async: true
  on_connect:
    # Report firmware/chip on every (re)connect: the server's OTA policy keys
    # off this unsolicited version report and the reply to get_version.
    then:
      - script.execute: publish_version
  on_json_message:
    # play — server → boopbox/<id>/play. The answer to a boop: stream `url`
    # through the media pipeline so the transport buttons can pause/resume it.
    # title/album/artist/duration are optional metadata the box may ignore.
    - topic: boopbox/${device_id}/play
      then:
        - lambda: |-
            if (!x.containsKey("url")) {
              ESP_LOGW("boopbox", "play without url; ignoring");
              return;
            }
            std::string url = x["url"].as<std::string>();
            const char *slug = x.containsKey("boop") && x["boop"].containsKey("slug")
                                 ? x["boop"]["slug"].as<const char *>() : "?";
            ESP_LOGI("boopbox", "play slug='%s' url=%s", slug, url.c_str());
            id(boop_player)
                ->make_call()
                .set_media_url(url)
                .perform();

api:
ota:
  - platform: esphome

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz
  id: bus_a

text_sensor:
  - platform: template
    name: "Last NFC UID"
    id: last_nfc_uid
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 20
    icon: mdi:nfc-variant
  - platform: template
    name: "Last NFC Payload"
    id: last_nfc_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 30
    icon: mdi:card-text-outline

binary_sensor:
  - platform: template
    name: "NFC Tag Present"
    id: nfc_tag_present
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 10
    icon: mdi:nfc-tap

# Write staged payload to the next NDEF-capable tag tapped (NTAG21x/Ultralight).
text:
  - platform: template
    name: "Tag Write Payload"
    id: tag_write_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 40
    optimistic: true
    mode: text
    initial_value: "boop/zelda"

  # Audio bring-up: any MP3/FLAC/WAV URL reachable from the box, e.g. a file
  # served with `python -m http.server` on your machine.
  - platform: template
    name: "Test Audio URL"
    id: test_audio_url
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "http://192.168.1.100:8000/test.mp3"

# 0-100 maps onto the media player's volume_min..volume_max, so 100 is the cap.
number:
  - platform: template
    name: "Volume"
    id: volume_number
    icon: mdi:volume-high
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 15
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: 'return id(boop_player).volume * 100.0f;'
    set_action:
      - media_player.volume_set:
          id: boop_player
          volume: !lambda 'return x / 100.0f;'

button:
  - platform: template
    name: "Write Tag"
    id: write_tag_button
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 50
    icon: mdi:nfc-tap
    on_press:
      then:
        - lambda: |-
            auto message = new nfc::NdefMessage();
            message->add_text_record(id(tag_write_payload).state);
            ESP_LOGI("boopbox", "Staging write, tap a tag now: %s",
                     id(tag_write_payload).state.c_str());
            id(pn532_board).write_mode(message);
        - wait_until:
            not:
              pn532.is_writing:
        - logger.log: "Finished writing tag"

  - platform: template
    name: "Play Test Audio"
    id: play_test_audio_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 20
    icon: mdi:play
    on_press:
      - media_player.play_media:
          id: boop_player
          # Media pipeline so the Play/Pause/Stop buttons act on it.
          media_url: !lambda 'return id(test_audio_url).state;'

  # Software transport controls (no physical buttons yet). These act on whatever
  # the player is doing — a server play or the test-audio button.
  - platform: template
    name: "Play"
    id: play_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 30
    icon: mdi:play
    on_press:
      - media_player.play:
          id: boop_player

  - platform: template
    name: "Pause"
    id: pause_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 31
    icon: mdi:pause
    on_press:
      - media_player.pause:
          id: boop_player

  - platform: template
    name: "Stop"
    id: stop_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 32
    icon: mdi:stop
    on_press:
      - media_player.stop:
          id: boop_player

  - platform: restart
    name: "Restart"
    id: restart_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 10

  # ESPHome has no WiFi-only clear; factory_reset wipes all prefs (which here is
  # effectively just the WiFi creds) and reboots into onboarding.
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 20

script:
  # version — box → boopbox/<id>/version. Firmware/chip telemetry the server's
  # OTA policy consumes; produces no reply.
  - id: publish_version
    then:
      - lambda: |-
          id(mqtt_client).publish_json(
            "boopbox/${device_id}/version",
            [=](JsonObject root) {
              root["v"] = 1;
              root["firmware"] = "${firmware_version}";
              root["chip"] = "${chip_family}";
            });

  # boop — box → boopbox/<id>/boop. One per tap; the server answers with a
  # single play or error. `slug` is the tag's NDEF payload; `uid` and `ts` are
  # informational.
  - id: publish_boop
    parameters:
      slug: string
      uid: string
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) {
            ESP_LOGW("boopbox", "MQTT not connected; dropping boop for '%s'",
                     slug.c_str());
            return;
          }
          // Short random correlation id, echoed back in the play/error reply.
          char boop_id[9];
          snprintf(boop_id, sizeof(boop_id), "%08x", (unsigned) random_uint32());
          std::string id_str(boop_id);
          uint32_t ts = id(sntp_time).now().is_valid()
                          ? (uint32_t) id(sntp_time).now().timestamp : 0;
          id(mqtt_client).publish_json(
            "boopbox/${device_id}/boop",
            [=](JsonObject root) {
              root["v"] = 1;
              root["id"] = id_str;
              root["slug"] = slug;
              root["uid"] = uid;
              root["ts"] = ts;
            });
          ESP_LOGI("boopbox", "Published boop id=%s slug='%s'",
                   id_str.c_str(), slug.c_str());

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrclk_pin}

# MAX98357A: GAIN floating (9 dB). SD pulled to VIN (1M) = Left-channel-only.
# One physical driver, so mono: the same samples go to both I2S slots, and the
# amp takes the left one.
speaker:
  - platform: i2s_audio
    id: boop_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono

  # Two pipelines (media + announcement) must each output to a unique speaker,
  # so a mixer fans them into the single physical driver. Media carries booped
  # tracks (pausable transport); announcements are fire-and-forget overlays.
  - platform: mixer
    id: boop_mixer
    output_speaker: boop_speaker
    source_speakers:
      - id: media_spk_in
      - id: announcement_spk_in

media_player:
  - platform: speaker
    name: "BoopBox Player"
    id: boop_player
    # NONE builds every decoder (MP3/FLAC/WAV/Opus) so arbitrary stream URLs
    # play, not just what Home Assistant would transcode to.
    media_pipeline:
      speaker: media_spk_in
      format: NONE
    announcement_pipeline:
      speaker: announcement_spk_in
      format: NONE
    # Ceiling protects the 3 W speaker and small ears; tune by ear.
    volume_max: 1.0
    volume_initial: 0.4

pn532_i2c:
  id: pn532_board
  i2c_id: bus_a
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          id(last_nfc_uid).publish_state(x);
          id(nfc_tag_present).publish_state(true);

          ESP_LOGI("boopbox", "=== NFC TAG READ ===");
          ESP_LOGI("boopbox", "UID: %s", x.c_str());

          // slug is the first NDEF text record's payload, which is what Write
          // Tag stages (e.g. "boop/zelda"). A UID-only tag has no slug and so
          // cannot be resolved server-side; log and skip the boop.
          std::string slug;
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            // ESPHome 2026.10: get_records() returns a const StaticVector of
            // unique_ptr; bind by const ref and iterate by const ref.
            const auto &records = message->get_records();
            ESP_LOGI("boopbox", "NDEF records: %d", (int) records.size());

            std::string combined;
            int i = 0;
            for (const auto &record : records) {
              std::string type = record->get_type();
              std::string payload = record->get_payload();
              ESP_LOGI("boopbox", "  [%d] type='%s' payload='%s'",
                       i, type.c_str(), payload.c_str());
              if (slug.empty()) slug = payload;
              if (!combined.empty()) combined += " | ";
              combined += payload;
              i++;
            }
            id(last_nfc_payload).publish_state(combined);
          } else {
            ESP_LOGI("boopbox", "No NDEF message on this tag (UID-only read).");
            id(last_nfc_payload).publish_state("<no NDEF — UID only>");
          }

          if (!slug.empty()) {
            id(publish_boop)->execute(slug, x);
          } else {
            ESP_LOGW("boopbox", "No slug on tag; not booping.");
          }
          ESP_LOGI("boopbox", "====================");
  on_tag_removed:
    then:
      - lambda: |-
          id(nfc_tag_present).publish_state(false);
          ESP_LOGD("boopbox", "Tag removed: %s", x.c_str());
