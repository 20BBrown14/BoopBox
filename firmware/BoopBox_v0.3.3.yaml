# Hardware: Adafruit Feather ESP32-S3 (4MB/2MB), PN532 in I2C mode,
# MAX98357A I2S amp. Wiring: hardware/boopbox-proto (KiCad).

substitutions:
  firmware_version: 0.3.3

  name: boopbox
  friendly_name: BoopBox
  # device_id is the box's stable identity: its MQTT username (broker ACLs key
  # on it) and the <id> in every boopbox/<id>/... topic. Must match a broker
  # account. Override per box at flash/compile time.
  device_id: boop-test
  mqtt_broker: 192.168.86.76
  mqtt_port: "1884"
  mqtt_username: boop-test
  mqtt_password: booptestpassword
  # Override at build time with `-s firmware_version X.Y.Z` to produce an OTA target.
  chip_family: esp32s3
  # Where the server's /firmware host is reachable from the box. The flash cmd
  # carries only a path.
  server_base_url: http://192.168.86.76:9685
  i2c_sda_pin: GPIO3
  i2c_scl_pin: GPIO4
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO10
  i2s_dout_pin: GPIO11
  # Capacitive touch pads (ESP32-S3 native touch; GPIO1-14 are touch-capable).
  touch_vol_up_pin: GPIO5      # Feather D5
  touch_vol_down_pin: GPIO6    # Feather D6
  touch_play_pin: GPIO14       # Feather A4
  # A0 on the Feather ESP32-S3 = GPIO18. NeoPixel ring data line.
  led_ring_pin: GPIO18

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    # GPIO7 powers the Feather's STEMMA QT / I2C port; must be high before the
    # bus scan or the PN532 is unpowered.
    - priority: 800
      then:
        - output.turn_on: i2c_power
    # Default priority: runs once the light is set up. ring_tick ends the spinner.
    - then:
        - script.execute: ring_render

esp32:
  board: adafruit_feather_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 4MB

psram:
  mode: quad
  speed: 80MHz

output:
  - platform: gpio
    id: i2c_power
    pin: GPIO7

logger:
  level: DEBUG

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_nfc
      name: "NFC"
      sorting_weight: 10
    - id: grp_boop
      name: "Boop"
      sorting_weight: 15
    - id: grp_audio_test
      name: "Audio Test"
      sorting_weight: 20
    - id: grp_controls
      name: "Controls"
      sorting_weight: 25
    - id: grp_led
      name: "LED Color"
      sorting_weight: 30
    - id: grp_ring_states
      name: "LED Ring States"
      sorting_weight: 35
    - id: grp_device
      name: "Device"
      sorting_weight: 90

# No credentials baked in: provisioned via Improv (serial) or the captive-portal AP.
wifi:
  ap:
    ssid: BoopBox Setup
    password: SnoopBox
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0
      dns1: 192.168.4.1
captive_portal:
improv_serial:

time:
  - platform: sntp
    id: sntp_time

# The box ↔ server contract runs over MQTT (server/docs/mqtt.md). discovery is
# off and topic_prefix null because the server owns the boopbox/<id>/... topic
# namespace rather than ESPHome's default device topics. idf_send_async keeps
# publishes off the main loop on the esp-idf framework.
mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: ${mqtt_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  client_id: ${device_id}
  discovery: false
  topic_prefix: null
  idf_send_async: true
  on_connect:
    # Report firmware/chip on every (re)connect: the server's OTA policy keys
    # off this unsolicited version report and the reply to get_version.
    # on_connect fires before the client counts as connected, so an immediate
    # publish is silently dropped. The delay lets the cmd subscription land
    # before the server's flash reply.
    then:
      - wait_until:
          condition:
            mqtt.connected:
          timeout: 10s
      - delay: 1s
      - script.execute: publish_version
  on_json_message:
    # play — server → boopbox/<id>/play. The answer to a boop: stream `url`
    # through the media pipeline so the transport buttons can pause/resume it.
    # title/album/artist/duration are optional metadata the box may ignore.
    - topic: boopbox/${device_id}/play
      then:
        - lambda: |-
            if (!x.containsKey("url")) {
              ESP_LOGW("boopbox", "play without url; ignoring");
              return;
            }
            std::string url = x["url"].as<std::string>();
            const char *slug = x.containsKey("boop") && x["boop"].containsKey("slug")
                                 ? x["boop"]["slug"].as<const char *>() : "?";
            ESP_LOGI("boopbox", "play slug='%s' url=%s", slug, url.c_str());
            id(boop_player)
                ->make_call()
                .set_media_url(url)
                .perform();

    # error — server → boopbox/<id>/error. A boop could not be answered. Branch
    # on `code`; `message` is generic display text. `boop` may be null for
    # unsupported_version.
    - topic: boopbox/${device_id}/error
      then:
        - lambda: |-
            std::string code = x.containsKey("code")
                                 ? x["code"].as<std::string>() : "unknown";
            const char *slug = x.containsKey("boop") && x["boop"].containsKey("slug")
                                 ? x["boop"]["slug"].as<const char *>() : "?";
            ESP_LOGW("boopbox", "boop error slug='%s' code=%s", slug, code.c_str());
            id(boop_status).publish_state("error: " + code + " (" + slug + ")");


    # error — server → boopbox/<id>/error. A boop could not be answered. Branch
    # on `code`, not `message` (per the contract).
    - topic: boopbox/${device_id}/error
      then:
        - lambda: |-
            const char *code = x.containsKey("code")
                                 ? x["code"].as<const char *>() : "?";
            ESP_LOGW("boopbox", "boop error code=%s", code);
        - script.execute:
            id: act_set
            state: ""
        - script.execute: boop_error

    # cmd — server → boopbox/<id>/cmd. get_version re-reports; flash pulls the
    # bin over authenticated HTTP. The device-id topic is the only one that may
    # flash.
    - topic: boopbox/${device_id}/cmd
      then:
        - lambda: |-
            if (!x.containsKey("cmd")) return;
            std::string cmd = x["cmd"].as<std::string>();
            ESP_LOGI("boopbox", "cmd=%s", cmd.c_str());
            if (cmd == "get_version") {
              id(publish_version)->execute();
            } else if (cmd == "flash") {
              std::string url = x["url"] | "";
              std::string md5 = x["md5"] | "";
              // Reject anything but a served firmware path and a 32-char md5.
              if (url.rfind("/firmware/", 0) != 0 || md5.size() != 32) {
                ESP_LOGW("boopbox", "flash cmd malformed; ignoring");
                return;
              }
              id(ota_flash_url) = "${server_base_url}" + url;
              id(ota_flash_md5) = md5;
              id(run_ota_flash)->execute();
            } else if (cmd == "write_tag") {
              std::string slug = x["slug"] | "";
              // 128 bytes fits the smallest tag (NTAG213, 144 B) with NDEF overhead.
              if (slug.empty() || slug.size() > 128) {
                ESP_LOGW("boopbox", "write_tag cmd needs a 1-128 byte slug; ignoring");
                return;
              }
              id(write_tag_run)->execute(slug);
            }

    # Broadcast cmd: version query only, never a flash.
    - topic: boopbox/all/cmd
      then:
        - lambda: |-
            if (x.containsKey("cmd") && x["cmd"] == "get_version") {
              id(publish_version)->execute();
            }

api:
http_request:
ota:
  - platform: esphome
  - platform: http_request
    id: ota_http
    # OTA blocks the main loop, so light actions never render mid-update. The
    # ring is lit on begin (sets brightness correction) and progress is written
    # straight to the strip.
    on_begin:
      # Claim the ring so the tick doesn't redraw over the progress bar.
      - lambda: 'id(ring_overlay) = "ota";'
      - light.turn_on:
          id: led_ring
          red: 0%
          green: 0%
          blue: 0%
          brightness: 60%
          transition_length: 0s
    on_progress:
      - lambda: |-
          auto *ring = static_cast<light::AddressableLight *>(id(led_ring)->get_output());
          int lit = (int) (x * ring->size() / 100.0f + 0.5f);
          for (int i = 0; i < ring->size(); i++) {
            (*ring)[i] = i < lit ? Color(255, 140, 0) : Color(0, 0, 0);
          }
          ring->schedule_show();
          ring->write_state(id(led_ring));
    on_end:
      - lambda: |-
          auto *ring = static_cast<light::AddressableLight *>(id(led_ring)->get_output());
          ring->all() = Color(0, 255, 0);
          ring->schedule_show();
          ring->write_state(id(led_ring));
    on_error:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: led_ring
                red: 100%
                green: 0%
                blue: 0%
                brightness: 60%
                transition_length: 0s
            - delay: 300ms
            - light.turn_off:
                id: led_ring
                transition_length: 0s
            - delay: 300ms
      - script.execute:
          id: ring_end
          name: "ota"

interval:
  - interval: 500ms
    then:
      - script.execute: ring_tick

  # Server reachability for the ring's "missing HTTP server" blink. Skipped
  # while the box is busy: it is evidently talking to the server then, and a
  # request to a dead host blocks the main loop until it times out.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return wifi::global_wifi_component->is_connected() && id(act_state).empty();'
          then:
            - http_request.get:
                url: ${server_base_url}/health
                on_response:
                  then:
                    - lambda: 'id(http_ok) = response->status_code >= 200 && response->status_code < 300;'
                on_error:
                  then:
                    - lambda: 'id(http_ok) = false;'

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz
  id: bus_a

# Native touch hub. On S2/S3 the hardware tracks each pad's untouched baseline
# ("benchmark") itself; a pad reads touched when smooth - benchmark > threshold,
# so each sensor's threshold is a delta, not an absolute reading. setup_mode
# logs value/benchmark/difference ~1/s for calibration: set each threshold to
# ~50-70% of the touched difference, then turn setup_mode off (it costs CPU).
# Default 8ms measurement is too long for the S3.
esp32_touch:
  setup_mode: false
  measurement_duration: 0.25ms
  sleep_duration: 0.5ms

# Battery fuel gauge: the Feather ESP32-S3 has a MAX17048 at I2C 0x36 on the
# STEMMA QT bus (GPIO7-powered). ESPHome's max17043 driver covers the MAX17048.
sensor:
  - platform: max17043
    i2c_id: bus_a
    update_interval: 60s
    battery_level:
      name: "Battery"
      id: battery_level
      accuracy_decimals: 0
      web_server:
        sorting_group_id: grp_device
        sorting_weight: 1
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      accuracy_decimals: 2
      web_server:
        sorting_group_id: grp_device
        sorting_weight: 2

text_sensor:
  - platform: template
    name: "Last NFC UID"
    id: last_nfc_uid
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 20
    icon: mdi:nfc-variant
  - platform: template
    name: "Last NFC Payload"
    id: last_nfc_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 30
    icon: mdi:card-text-outline
  # Outcome of the latest boop as the box saw it: sent, playing, error, or not sent.
  - platform: template
    name: "Last Boop Result"
    id: boop_status
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 30
    icon: mdi:message-reply-text-outline

binary_sensor:
  - platform: template
    name: "NFC Tag Present"
    id: nfc_tag_present
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 10
    icon: mdi:nfc-tap
  
  # Capacitive transport controls. Thresholds are BREADBOARD values (bare
  # metal lead tips, 2026-11-07): idle |diff| < ~200, hand hovering near a lead
  # ~800-1900, direct touch 150k-420k. Recalibrate behind the real panel; a
  # touch through plastic will be far smaller. The delayed_on/off filters debounce
  # brief noise spikes. They act on boop_player like the web UI buttons do.
  - platform: esp32_touch
    name: "Touch Vol Up"
    id: touch_vol_up
    pin: ${touch_vol_up_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 10
    icon: mdi:volume-plus
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: vol up"
      - media_player.volume_up: boop_player

  - platform: esp32_touch
    name: "Touch Vol Down"
    id: touch_vol_down
    pin: ${touch_vol_down_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 20
    icon: mdi:volume-minus
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: vol down"
      - media_player.volume_down: boop_player

  - platform: esp32_touch
    name: "Touch Play Pause"
    id: touch_play
    pin: ${touch_play_pin}
    threshold: 5000
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 30
    icon: mdi:play-pause
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log: "touch: play/pause"
      # Toggle play<->pause; ignored when nothing is playing or paused
      # (idle/announcing), so a stray touch can't start playback from idle.
      - if:
          condition:
            media_player.is_playing:
          then:
            - media_player.pause:
                id: boop_player
          else:
            - if:
                condition:
                  media_player.is_paused:
                then:
                  - media_player.play:
                      id: boop_player

# Mute is volume 0 with the previous level remembered: the MAX98357A has no
# mute pin wired and there's no audio_dac, so there's no hardware mute. State is
# derived from the volume so the slider and buttons stay consistent with it.
switch:
  - platform: template
    name: "Mute"
    id: mute_switch
    icon: mdi:volume-off
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 16
    lambda: 'return id(boop_player).volume <= 0.001f;'
    turn_on_action:
      - lambda: |-
          float v = id(boop_player).volume;
          if (v > 0.001f) id(premute_volume) = v;
      - media_player.volume_set:
          id: boop_player
          volume: 0.0
      - script.execute: show_volume
    turn_off_action:
      - media_player.volume_set:
          id: boop_player
          volume: !lambda 'return id(premute_volume);'
      - script.execute: show_volume

# Write staged payload to the next NDEF-capable tag tapped (NTAG21x/Ultralight).
text:
  - platform: template
    name: "Tag Write Payload"
    id: tag_write_payload
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 40
    optimistic: true
    mode: text
    initial_value: "boop/zelda"

  # Slug sent by Simulate Tag Read, exactly as if a tag carrying it were tapped.
  - platform: template
    name: "Simulate Slug"
    id: simulate_slug
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "boop/example"

  # Audio bring-up: any MP3/FLAC/WAV URL reachable from the box, e.g. a file
  # served with `python -m http.server` on your machine.
  - platform: template
    name: "Test Audio URL"
    id: test_audio_url
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 10
    optimistic: true
    mode: text
    restore_value: true
    initial_value: "http://192.168.1.100:8000/test.mp3"

# 0-100 maps onto the media player's volume_min..volume_max, so 100 is the cap.
number:
  - platform: template
    name: "Volume"
    id: volume_number
    icon: mdi:volume-high
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 15
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: 'return id(boop_player).volume * 100.0f;'
    set_action:
      - media_player.volume_set:
          id: boop_player
          volume: !lambda 'return x / 100.0f;'
      - script.execute: show_volume

  # Standalone color tuner (0-255 per channel), independent of the boop flash.
  # Drives only the Preview Color button. restore_value keeps a tuned color
  # across reboots.
  - platform: template
    name: "Tune Color R"
    id: tune_color_r
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 10
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 128

  - platform: template
    name: "Tune Color G"
    id: tune_color_g
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 11
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 204

  - platform: template
    name: "Tune Color B"
    id: tune_color_b
    icon: mdi:palette
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 12
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 255

  # Master brightness for the preview, separate from the R/G/B mix so you can
  # dim a hue without rescaling all three channels.
  - platform: template
    name: "Tune Brightness"
    id: tune_brightness
    icon: mdi:brightness-6
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 13
    mode: slider
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 255

button:
  - platform: template
    name: "Write Tag"
    id: write_tag_button
    web_server:
      sorting_group_id: grp_nfc
      sorting_weight: 50
    icon: mdi:nfc-tap
    on_press:
      then:
        - script.execute:
            id: write_tag_run
            slug: !lambda 'return id(tag_write_payload).state;'
    # Boop without a physical tag: goes through the same publish path as a tap.
  - platform: template
    name: "Simulate Tag Read"
    id: simulate_tag_read_button
    web_server:
      sorting_group_id: grp_boop
      sorting_weight: 20
    icon: mdi:nfc-search-variant
    on_press:
      - lambda: 'id(publish_boop)->execute(id(simulate_slug).state, "simulated");'


  - platform: template
    name: "Play Test Audio"
    id: play_test_audio_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 20
    icon: mdi:play
    on_press:
      - media_player.play_media:
          id: boop_player
          # Media pipeline so the Play/Pause/Stop buttons act on it.
          media_url: !lambda 'return id(test_audio_url).state;'

  # Software transport controls. These act on whatever
  # the player is doing — a server play or the test-audio button.
  - platform: template
    name: "Play"
    id: play_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 30
    icon: mdi:play
    on_press:
      - media_player.play:
          id: boop_player

  - platform: template
    name: "Pause"
    id: pause_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 31
    icon: mdi:pause
    on_press:
      - media_player.pause:
          id: boop_player

  - platform: template
    name: "Stop"
    id: stop_button
    web_server:
      sorting_group_id: grp_audio_test
      sorting_weight: 32
    icon: mdi:stop
    on_press:
      - media_player.stop:
          id: boop_player

  # Hold the tuned color on the ring (steady, no fade) so you can eyeball it.
  - platform: template
    name: "Preview Color"
    id: preview_color_button
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 20
    icon: mdi:eyedropper
    on_press:
      - script.stop: ring_preview
      - lambda: |-
          id(ring_overlay) = "";
          id(ring_force) = "preview";
      - light.turn_on:
          id: led_ring
          effect: "None"
          red: !lambda 'return id(tune_color_r).state / 255.0f;'
          green: !lambda 'return id(tune_color_g).state / 255.0f;'
          blue: !lambda 'return id(tune_color_b).state / 255.0f;'
          brightness: !lambda 'return id(tune_brightness).state / 255.0f;'

  # Ends any preview and hands the ring back to its real state.
  - platform: template
    name: "LED Off"
    id: led_off_button
    web_server:
      sorting_group_id: grp_led
      sorting_weight: 22
    icon: mdi:lightbulb-off
    on_press:
      - script.stop: ring_preview
      - lambda: |-
          id(ring_force) = "";
          id(ring_shown) = "";
      - light.turn_off:
          id: led_ring
          transition_length: 0s
      - script.execute: ring_render

  # One button per ring state. Persistent states hold for 15s (or until LED
  # Off); timed ones play once.
  - platform: template
    name: "Ring: Booting"
    id: ring_btn_boot
    icon: mdi:power
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 10}
    on_press:
      - script.execute: {id: ring_preview, state: "boot"}

  - platform: template
    name: "Ring: Boot Done"
    id: ring_btn_rainbow
    icon: mdi:looks
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 11}
    on_press:
      - script.execute: boot_rainbow

  - platform: template
    name: "Ring: WiFi Setup"
    id: ring_btn_onboarding
    icon: mdi:wifi-cog
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 12}
    on_press:
      - script.execute: {id: ring_preview, state: "onboarding"}

  - platform: template
    name: "Ring: MQTT Missing"
    id: ring_btn_mqtt
    icon: mdi:lan-disconnect
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 13}
    on_press:
      - script.execute: {id: ring_preview, state: "mqtt"}

  - platform: template
    name: "Ring: Server Missing"
    id: ring_btn_http
    icon: mdi:server-off
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 14}
    on_press:
      - script.execute: {id: ring_preview, state: "http"}

  - platform: template
    name: "Ring: Boop"
    id: ring_btn_boop
    icon: mdi:nfc-tap
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 15}
    on_press:
      - script.execute: flash_boop

  - platform: template
    name: "Ring: Thinking"
    id: ring_btn_thinking
    icon: mdi:timer-sand
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 16}
    on_press:
      - script.execute: {id: ring_preview, state: "thinking"}

  - platform: template
    name: "Ring: Playing"
    id: ring_btn_playing
    icon: mdi:play
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 17}
    on_press:
      - script.execute: {id: ring_preview, state: "playing"}

  - platform: template
    name: "Ring: Paused"
    id: ring_btn_paused
    icon: mdi:pause
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 18}
    on_press:
      - script.execute: {id: ring_preview, state: "paused"}

  - platform: template
    name: "Ring: Volume"
    id: ring_btn_volume
    icon: mdi:volume-high
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 19}
    on_press:
      - script.execute: show_volume

  - platform: template
    name: "Ring: Volume Zero"
    id: ring_btn_vol_zero
    icon: mdi:volume-off
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 20}
    on_press:
      - script.execute: {id: ring_pulse, state: "vol_zero", ms: 1000}

  - platform: template
    name: "Ring: Boop Error"
    id: ring_btn_error
    icon: mdi:alert-circle
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 21}
    on_press:
      - script.execute: boop_error

  - platform: template
    name: "Ring: Write Waiting"
    id: ring_btn_write_wait
    icon: mdi:nfc-search-variant
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 22}
    on_press:
      - script.execute: {id: ring_preview, state: "write_wait"}

  - platform: template
    name: "Ring: Write Busy"
    id: ring_btn_write_busy
    icon: mdi:nfc-variant
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 23}
    on_press:
      - script.execute: {id: ring_preview, state: "write_busy"}

  - platform: template
    name: "Ring: Write Failed"
    id: ring_btn_write_fail
    icon: mdi:close-circle
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 25}
    on_press:
      - script.execute: write_fail

  - platform: template
    name: "Ring: Write Done"
    id: ring_btn_write_done
    icon: mdi:check-circle
    web_server: {sorting_group_id: grp_ring_states, sorting_weight: 24}
    on_press:
      - script.execute: {id: ring_pulse, state: "write_done", ms: 1500}

  - platform: restart
    name: "Restart"
    id: restart_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 10

  # ESPHome has no WiFi-only clear; factory_reset wipes all prefs (which here is
  # effectively just the WiFi creds) and reboots into onboarding.
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 20

# Hand-off from the cmd lambda to the flash script: the action's templatable
# fields can't take the trigger's `x` from a separate script.
globals:
  - id: ota_flash_url
    type: std::string
  - id: ota_flash_md5
    type: std::string
  - id: premute_volume
    type: float
    initial_value: '0.4'
  # LED ring state, see ring_render. Overlay and force are "" when unused.
  - id: act_state
    type: std::string
  - id: write_state
    type: std::string
  - id: ring_overlay
    type: std::string
  - id: ring_force
    type: std::string
  - id: ring_shown
    type: std::string
  # One-shot fade-out length for the next "off" render.
  - id: ring_off_ms
    type: int
    initial_value: '0'
  - id: boot_done
    type: bool
    initial_value: 'false'
  - id: http_ok
    type: bool
    initial_value: 'true'
  - id: write_finished
    type: bool
    initial_value: 'false'

script:
  # run_ota_flash — HTTP Basic: username = device id, password = OTA secret.
  - id: run_ota_flash
    mode: single
    then:
      - ota.http_request.flash:
          url: !lambda 'return id(ota_flash_url);'
          md5: !lambda 'return id(ota_flash_md5);'
          username: ${device_id}
          password: !secret boopbox_ota_secret

  # ---- LED ring ----
  # ring_render shows the highest-priority state: timed overlay, web preview,
  # boot, tag write mode, activity (thinking/playing/paused), wifi, mqtt, http,
  # then off. ring_shown keeps it idempotent so the 500ms tick doesn't restart
  # a running effect.
  - id: ring_render
    then:
      - lambda: |-
          if (!id(ring_overlay).empty()) return;
          std::string s;
          if (!id(ring_force).empty()) {
            if (id(ring_force) == "preview") return;
            s = id(ring_force);
          } else if (!id(boot_done)) {
            s = "boot";
          } else if (!id(write_state).empty()) {
            s = id(write_state);
          } else if (!id(act_state).empty()) {
            s = id(act_state);
          } else if (!wifi::global_wifi_component->is_connected()) {
            s = "onboarding";
          } else if (!id(mqtt_client).is_connected()) {
            s = "mqtt";
          } else if (!id(http_ok)) {
            s = "http";
          } else {
            s = "off";
          }
          int fade = id(ring_off_ms);
          id(ring_off_ms) = 0;
          if (s == id(ring_shown)) return;
          id(ring_apply)->execute(s, fade);

  # ring_apply — the look of every state. Unknown names and "off" turn the ring
  # off (over fade_ms). A negative brightness is left to the effect (pulses).
  - id: ring_apply
    parameters:
      state: string
      fade_ms: int
    then:
      - lambda: |-
          id(ring_shown) = state;
          std::string effect = "None";
          float r = 1.0f, g = 1.0f, b = 1.0f;
          float br = -1.0f;
          uint32_t tr = 0;
          if (state == "boot") { effect = "Boot Spin"; br = 0.4f; }
          else if (state == "rainbow") { effect = "Roygbiv"; br = 0.4f; }
          else if (state == "onboarding") { effect = "Onboarding"; r = 1.0f; g = 0.78f; b = 0.0f; }
          else if (state == "mqtt") { effect = "Blink 2"; br = 0.4f; }
          else if (state == "http") { effect = "Blink 3"; br = 0.4f; }
          else if (state == "thinking") { effect = "Thinking"; br = 0.3f; }
          else if (state == "playing") { effect = "Comet"; br = 0.3f; }
          else if (state == "paused") { effect = "Paused"; r = 0.0f; g = 0.81f; b = 1.0f; }
          else if (state == "write_wait") { effect = "Write Waiting"; r = 0.6f; g = 0.0f; b = 1.0f; }
          else if (state == "write_busy") { effect = "Write Busy"; r = 0.6f; g = 0.0f; b = 1.0f; }
          else if (state == "write_done") { r = 0.0f; g = 1.0f; b = 0.0f; br = 0.6f; }
          else if (state == "write_fail") { r = 1.0f; g = 0.0f; b = 0.0f; br = 0.6f; tr = 600; }
          else if (state == "error_on") { r = 1.0f; g = 0.0f; b = 0.0f; br = 0.6f; }
          else if (state == "vol_zero") { r = 1.0f; g = 0.0f; b = 0.0f; br = 0.3f; }
          else if (state == "vol_bar") { effect = "Volume Bar"; br = 0.6f; }
          else if (state == "boop") { r = 0.0f; g = 0.81f; b = 1.0f; br = 0.6f; tr = 250; }
          else {
            id(led_ring).turn_off().set_transition_length(fade_ms).perform();
            return;
          }
          // A call can't carry both an effect and a transition (the transition
          // is dropped), so solid states stop the effect in a separate call.
          if (effect == "None") {
            id(led_ring).make_call().set_effect(effect).perform();
            auto call = id(led_ring).turn_on();
            call.set_rgb(r, g, b);
            if (br >= 0.0f) call.set_brightness(br);
            call.set_transition_length(tr);
            call.perform();
          } else {
            auto call = id(led_ring).turn_on();
            call.set_effect(effect);
            call.set_rgb(r, g, b);
            if (br >= 0.0f) call.set_brightness(br);
            call.perform();
          }

  # ring_tick — every 500ms. Ends the boot spinner once MQTT is up (or after
  # 15s regardless), plays the rainbow, and re-renders so wifi/mqtt/http
  # changes show up without their own hooks.
  - id: ring_tick
    then:
      - if:
          condition:
            lambda: 'return !id(boot_done) && (id(mqtt_client).is_connected() || millis() > 15000);'
          then:
            - lambda: 'id(boot_done) = true;'
            - script.execute: boot_rainbow
      - script.execute: ring_render

  # ring_end — an overlay is finished. Only releases the ring if the overlay
  # still owns it, so a newer overlay isn't cut short.
  - id: ring_end
    parameters:
      name: string
    then:
      - lambda: |-
          if (id(ring_overlay) == name) {
            id(ring_overlay) = "";
            id(ring_shown) = "";
          }
      - script.execute: ring_render

  # ring_pulse — show a state for `ms`, then hand the ring back.
  - id: ring_pulse
    mode: restart
    parameters:
      state: string
      ms: int
    then:
      - lambda: 'id(ring_overlay) = state;'
      - script.execute:
          id: ring_apply
          state: !lambda 'return state;'
          fade_ms: 0
      - delay: !lambda 'return ms;'
      - script.execute:
          id: ring_end
          name: !lambda 'return state;'

  # ring_preview — web UI: hold a persistent state for 15s.
  - id: ring_preview
    mode: restart
    parameters:
      state: string
    then:
      - lambda: |-
          id(ring_overlay) = "";
          id(ring_force) = state;
      - script.execute:
          id: ring_apply
          state: !lambda 'return state;'
          fade_ms: 0
      - delay: 15s
      - lambda: |-
          id(ring_force) = "";
          id(ring_shown) = "";
      - script.execute: ring_render

  # act_set — set thinking / playing / paused, or "" for none. Re-arms the
  # state's timeout in full, which is also how the volume bar hands back.
  - id: act_set
    parameters:
      state: string
    then:
      - script.stop: thinking_watchdog
      - script.stop: paused_watchdog
      - lambda: |-
          if (state.empty() && id(act_state) == "playing") id(ring_off_ms) = 1500;
          id(act_state) = state;
      - if:
          condition:
            lambda: 'return state == "thinking";'
          then:
            - script.execute: thinking_watchdog
      - if:
          condition:
            lambda: 'return state == "paused";'
          then:
            - script.execute: paused_watchdog
      - script.execute: ring_render

  # Failsafes: a boop that never gets an answer, and a pause nobody resumed.
  - id: thinking_watchdog
    mode: restart
    then:
      - delay: 20s
      - lambda: 'id(act_state) = "";'
      - script.execute: ring_render

  - id: paused_watchdog
    mode: restart
    then:
      - delay: 2min
      - lambda: |-
          id(act_state) = "";
          id(ring_off_ms) = 1000;
      - script.execute: ring_render

  # show_volume — fill the ring in proportion to volume (red at zero), then
  # hand the ring back. The delay lets the media player apply the volume
  # command first. The timeouts are re-armed at the end so the interrupted
  # state gets its full time again.
  - id: show_volume
    mode: restart
    then:
      - script.stop: thinking_watchdog
      - script.stop: paused_watchdog
      - delay: 100ms
      - lambda: 'id(ring_overlay) = "volume";'
      - if:
          condition:
            lambda: 'return id(boop_player).volume <= 0.001f;'
          then:
            - script.execute:
                id: ring_apply
                state: "vol_zero"
                fade_ms: 0
            - delay: 1s
          else:
            - script.execute:
                id: ring_apply
                state: "vol_bar"
                fade_ms: 0
            - delay: 1500ms
      - script.execute:
          id: ring_end
          name: "volume"
      - script.execute:
          id: act_set
          state: !lambda 'return id(act_state);'

  # boop_begin — a boop supersedes whatever is playing or paused. The stop is
  # awaited so its on_idle runs before the spinner starts; otherwise on_idle
  # would cancel the new spinner. restart mode so rapid re-taps don't stack.
  - id: boop_begin
    mode: restart
    then:
      - script.stop: ring_preview
      - lambda: 'id(ring_force) = "";'
      - if:
          condition:
            not:
              media_player.is_idle:
          then:
            - media_player.stop:
                id: boop_player
            - wait_until:
                condition:
                  media_player.is_idle:
                timeout: 2s
      - script.execute: flash_boop
      - script.execute:
          id: act_set
          state: "thinking"

  # flash_boop — light-blue flash acknowledging a tap; 700ms in all.
  - id: flash_boop
    mode: restart
    then:
      - lambda: 'id(ring_overlay) = "boop";'
      - script.execute:
          id: ring_apply
          state: "boop"
          fade_ms: 0
      - delay: 250ms
      - script.execute:
          id: ring_apply
          state: "off"
          fade_ms: 400
      - delay: 450ms
      - script.execute:
          id: ring_end
          name: "boop"

  # boop_error — three red flashes.
  - id: boop_error
    mode: restart
    then:
      - script.stop: flash_boop
      - lambda: 'id(ring_overlay) = "error";'
      - repeat:
          count: 3
          then:
            - script.execute:
                id: ring_apply
                state: "error_on"
                fade_ms: 0
            - delay: 200ms
            - script.execute:
                id: ring_apply
                state: "off"
                fade_ms: 0
            - delay: 200ms
      - script.execute:
          id: ring_end
          name: "error"

  # write_fail — one red pulse: fade up to 60% over 600ms, back down over 600ms.
  - id: write_fail
    mode: restart
    then:
      - lambda: 'id(ring_overlay) = "write_fail";'
      - script.execute:
          id: ring_apply
          state: "off"
          fade_ms: 0
      - script.execute:
          id: ring_apply
          state: "write_fail"
          fade_ms: 0
      - delay: 600ms
      - script.execute:
          id: ring_apply
          state: "off"
          fade_ms: 600
      - delay: 600ms
      - script.execute:
          id: ring_end
          name: "write_fail"

  # boot_rainbow — plays once the box is up. 1950ms matches the Roygbiv effect
  # (13 frames at 150ms).
  - id: boot_rainbow
    mode: restart
    then:
      - lambda: 'id(ring_overlay) = "rainbow";'
      - script.execute:
          id: ring_apply
          state: "rainbow"
          fade_ms: 0
      - delay: 1950ms
      - script.execute:
          id: ring_end
          name: "rainbow"

  # write_tag_run — arm the reader to write `slug` to the next tag. The PN532
  # driver writes inside a single blocking loop() pass and reports no tag-found
  # event, so the ring shows write_wait until the write is over. Its
  # on_finished_write sets write_finished; is_writing going false without it
  # means the tag couldn't be formatted.
  - id: write_tag_run
    mode: restart
    parameters:
      slug: string
    then:
      - script.stop: ring_preview
      - lambda: |-
          auto *message = new nfc::NdefMessage();
          message->add_text_record(slug);
          ESP_LOGI("boopbox", "Write mode armed, slug='%s'", slug.c_str());
          id(write_finished) = false;
          id(ring_force) = "";
          id(write_state) = "write_wait";
          id(pn532_board).write_mode(message);
      - script.execute: ring_render
      - wait_until:
          condition:
            not:
              pn532.is_writing:
          timeout: 30s
      - if:
          condition:
            pn532.is_writing:
          then:
            - lambda: |-
                ESP_LOGW("boopbox", "Write mode timed out; cancelling");
                id(pn532_board).read_mode();
                id(write_state) = "";
            - script.execute: ring_render
          else:
            - lambda: 'id(write_state) = "";'
            - if:
                condition:
                  lambda: 'return id(write_finished);'
                then:
                  - script.execute:
                      id: ring_pulse
                      state: "write_done"
                      ms: 1500
                else:
                  - script.execute: write_fail

  # version — box → boopbox/<id>/version. Firmware/chip telemetry the server's
  # OTA policy consumes; produces no reply.
  - id: publish_version
    then:
      - lambda: |-
          bool ok = id(mqtt_client).publish_json(
            "boopbox/${device_id}/version",
            [=](JsonObject root) {
              root["v"] = 1;
              root["firmware"] = "${firmware_version}";
              root["chip"] = "${chip_family}";
            });
          if (ok) {
            ESP_LOGI("boopbox", "version reported: ${firmware_version}");
          } else {
            ESP_LOGW("boopbox", "version publish failed");
          }

  # boop — box → boopbox/<id>/boop. One per tap; the server answers with a
  # single play or error. `slug` is the tag's NDEF payload; `uid` and `ts` are
  # informational.
  - id: publish_boop
    parameters:
      slug: string
      uid: string
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) {
            ESP_LOGW("boopbox", "MQTT not connected; dropping boop for '%s'",
                     slug.c_str());
            id(boop_status).publish_state("not sent (MQTT offline): " + slug);
            return;
          }
          // Short random correlation id, echoed back in the play/error reply.
          char boop_id[9];
          snprintf(boop_id, sizeof(boop_id), "%08x", (unsigned) random_uint32());
          std::string id_str(boop_id);
          uint32_t ts = id(sntp_time).now().is_valid()
                          ? (uint32_t) id(sntp_time).now().timestamp : 0;
          id(mqtt_client).publish_json(
            "boopbox/${device_id}/boop",
            [=](JsonObject root) {
              root["v"] = 1;
              root["id"] = id_str;
              root["slug"] = slug;
              root["uid"] = uid;
              root["ts"] = ts;
            });
          ESP_LOGI("boopbox", "Published boop id=%s slug='%s'",
                   id_str.c_str(), slug.c_str());
          id(boop_status).publish_state("sent " + slug);

i2s_audio:
  - id: i2s_out
    i2s_bclk_pin: ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrclk_pin}

# MAX98357A: GAIN to GND (12 dB), SD floating = (L+R)/2 mix. One physical
# driver, so mono: the same samples go to both I2S slots, and the amp's L+R mix
# plays them at full level. Wiring: notes/breadboard-mono-connections.md.
speaker:
  - platform: i2s_audio
    id: boop_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
    channel: mono

  # Two pipelines (media + announcement) must each output to a unique speaker,
  # so a mixer fans them into the single physical driver. Media carries booped
  # tracks (pausable transport); announcements are fire-and-forget overlays.
  - platform: mixer
    id: boop_mixer
    output_speaker: boop_speaker
    source_speakers:
      - id: media_spk_in
      - id: announcement_spk_in

media_player:
  - platform: speaker
    name: "BoopBox Player"
    id: boop_player
    # NONE builds every decoder (MP3/FLAC/WAV/Opus) so arbitrary stream URLs
    # play, not just what Home Assistant would transcode to.
    media_pipeline:
      speaker: media_spk_in
      format: NONE
    announcement_pipeline:
      speaker: announcement_spk_in
      format: NONE
    # Ceiling protects the 3 W speaker and small ears; tune by ear.
    volume_max: 1.0
    volume_initial: 0.4
    on_play:
      - script.execute:
          id: act_set
          state: "playing"
    on_idle:
      - script.execute:
          id: act_set
          state: ""
    on_pause:
      - script.execute:
          id: act_set
          state: "paused"

# NeoPixel ring (12x WS2812/NeoPixel) on A0 (GPIO18). esp32_rmt_led_strip drives
# it off the RMT peripheral, which is the reliable path on the esp-idf framework.
light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: ${led_ring_pin}
    num_leds: 12
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: grp_device
      sorting_weight: 30
    effects:
      # Reads the player's volume live, so it needs no state of its own.
      - addressable_lambda:
          name: "Volume Bar"
          update_interval: 50ms
          lambda: |-
            // Whole LEDs for the integer part; the next LED's brightness shows
            // the remainder, so 5% volume steps are all visible on 12 LEDs.
            float level = id(boop_player).volume * it.size();
            int full = (int) level;
            uint8_t partial = (uint8_t) ((level - full) * 255.0f + 0.5f);
            for (int i = 0; i < it.size(); i++) {
              if (i < full) it[i] = Color(0, 255, 0);
              else if (i == full) it[i] = Color(0, partial, 0);
              else it[i] = Color::BLACK;
            }

      # Four phases of n steps each: fill forward, clear forward, fill
      # backward, clear backward. Each phase ends where the next begins, so
      # there is no blank frame between them.
      - addressable_lambda:
          name: "Thinking"
          update_interval: 60ms
          lambda: |-
            static int step = 0;
            if (initial_run) step = 0;
            const int n = it.size();
            const int phase = step / n;
            const int k = step % n;
            for (int i = 0; i < n; i++) {
              bool on;
              switch (phase) {
                case 0:  on = i <= k; break;
                case 1:  on = i > k; break;
                case 2:  on = i >= n - 1 - k; break;
                default: on = i < n - 1 - k; break;
              }
              it[i] = on ? Color(0, 170, 228) : Color::BLACK;
            }
            step = (step + 1) % (4 * n);

      # Slow breathe while paused: fade up over 1.5s, fade down over 1.5s.
      - pulse:
          name: "Paused"
          transition_length: 1500ms
          update_interval: 3s
          min_brightness: 3%
          max_brightness: 30%

      # The pulses take their color from the light state set in ring_apply.
      - pulse:
          name: "Onboarding"
          transition_length: 1500ms
          update_interval: 3s
          min_brightness: 3%
          max_brightness: 30%

      - pulse:
          name: "Write Waiting"
          transition_length: 1500ms
          update_interval: 3s
          min_brightness: 3%
          max_brightness: 60%

      - pulse:
          name: "Write Busy"
          transition_length: 200ms
          update_interval: 400ms
          min_brightness: 3%
          max_brightness: 60%

      # Fast blue circle while booting. Position comes from the clock, so the
      # head moves smoothly between LEDs.
      - addressable_lambda:
          name: "Boot Spin"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const float tail = 5.0f;
            float pos = (millis() % 600) / 600.0f * n;
            for (int i = 0; i < n; i++) {
              float d = pos - i;
              if (d < 0) d += n;
              float v = 0.0f;
              if (d < tail) v = 1.0f - d / tail;
              else if (n - d < 1.0f) v = 1.0f - (n - d);
              it[i] = Color((uint8_t) (0 * v), (uint8_t) (60 * v), (uint8_t) (255 * v));
            }

      # Slow rotating comet while audio plays.
      - addressable_lambda:
          name: "Comet"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const float tail = 6.0f;
            float pos = (millis() % 2400) / 2400.0f * n;
            for (int i = 0; i < n; i++) {
              float d = pos - i;
              if (d < 0) d += n;
              float v = 0.0f;
              if (d < tail) v = 1.0f - d / tail;
              else if (n - d < 1.0f) v = 1.0f - (n - d);
              it[i] = Color((uint8_t) (0 * v), (uint8_t) (170 * v), (uint8_t) (228 * v));
            }

      # Red to violet and back, one color per 150ms: 13 frames, 1950ms in all.
      # boot_rainbow's delay must match.
      - addressable_lambda:
          name: "Roygbiv"
          update_interval: 150ms
          lambda: |-
            static const Color pal[7] = {
              Color(255, 0, 0),   Color(255, 80, 0),  Color(255, 200, 0),
              Color(0, 255, 0),   Color(0, 0, 255),   Color(75, 0, 130),
              Color(148, 0, 211)};
            static int step = 0;
            if (initial_run) step = 0;
            int idx = step < 7 ? step : 12 - step;
            it.all() = pal[idx];
            step = (step + 1) % 13;

      # Missing MQTT broker: two blinks, then a rest.
      - addressable_lambda:
          name: "Blink 2"
          update_interval: 50ms
          lambda: |-
            static uint32_t t0 = 0;
            if (initial_run) t0 = millis();
            uint32_t t = (millis() - t0) % 2500;
            bool on = t < 1000 && (t % 500) < 250;
            it.all() = on ? Color(255, 0, 0) : Color::BLACK;

      # Missing HTTP server: three blinks, then a rest.
      - addressable_lambda:
          name: "Blink 3"
          update_interval: 50ms
          lambda: |-
            static uint32_t t0 = 0;
            if (initial_run) t0 = millis();
            uint32_t t = (millis() - t0) % 3000;
            bool on = t < 1500 && (t % 500) < 250;
            it.all() = on ? Color(255, 0, 0) : Color::BLACK;

pn532_i2c:
  id: pn532_board
  i2c_id: bus_a
  update_interval: 500ms
  # Fires once a write was attempted on a formattable tag; the driver doesn't
  # say whether the write itself succeeded.
  on_finished_write:
    then:
      - lambda: 'id(write_finished) = true;'
  on_tag:
    then:
      - lambda: |-
          id(last_nfc_uid).publish_state(x);
          id(nfc_tag_present).publish_state(true);

          ESP_LOGI("boopbox", "=== NFC TAG READ ===");
          ESP_LOGI("boopbox", "UID: %s", x.c_str());

          // slug is the first NDEF text record's payload, which is what Write
          // Tag stages (e.g. "boop/zelda"). A UID-only tag has no slug and so
          // cannot be resolved server-side; log and skip the boop.
          std::string slug;
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            // ESPHome 2026.10: get_records() returns a const StaticVector of
            // unique_ptr; bind by const ref and iterate by const ref.
            const auto &records = message->get_records();
            ESP_LOGI("boopbox", "NDEF records: %d", (int) records.size());

            std::string combined;
            int i = 0;
            for (const auto &record : records) {
              std::string type = record->get_type();
              std::string payload = record->get_payload();
              ESP_LOGI("boopbox", "  [%d] type='%s' payload='%s'",
                       i, type.c_str(), payload.c_str());
              if (slug.empty()) slug = payload;
              if (!combined.empty()) combined += " | ";
              combined += payload;
              i++;
            }
            id(last_nfc_payload).publish_state(combined);
          } else {
            ESP_LOGI("boopbox", "No NDEF message on this tag (UID-only read).");
            id(last_nfc_payload).publish_state("<no NDEF — UID only>");
          }

          if (!slug.empty()) {
            id(boop_begin)->execute();
            id(publish_boop)->execute(slug, x);
          } else {
            ESP_LOGW("boopbox", "No slug on tag; not booping.");
          }
          ESP_LOGI("boopbox", "====================");
  on_tag_removed:
    then:
      - lambda: |-
          id(nfc_tag_present).publish_state(false);
          ESP_LOGD("boopbox", "Tag removed: %s", x.c_str());